name: NuGet

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 8.0.x
  CONFIGURATION: Release
  PACK_SOLUTION: ObjectStorageAsset.Pack.slnf

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Credentials below belong only to disposable containers on this runner.
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Osa-CI-only-2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Osa-CI-only-2026!' -C -Q 'SELECT 1' -b"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18

    env:
      OSA_TEST_SQL_SERVER: 127.0.0.1,1433
      OSA_TEST_SQL_USER: sa
      OSA_TEST_SQL_PASSWORD: Osa-CI-only-2026!
      OSA_E2E_SQL_SERVER: 127.0.0.1,1433
      OSA_E2E_SQL_USER: sa
      OSA_E2E_SQL_PASSWORD: Osa-CI-only-2026!
      OSA_E2E_MINIO_ENDPOINT: 127.0.0.1:9000
      OSA_E2E_MINIO_ACCESS_KEY: osa-ci
      OSA_E2E_MINIO_SECRET_KEY: osa-ci-only-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned v0.1.6 for binary compatibility
        uses: actions/checkout@v4
        with:
          ref: 2d323d419c1d3e380a36efb0d88685eb46c09b5b
          path: artifacts/legacy-source
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Compute package version
        id: version
        shell: bash
        run: |
          VERSION_PREFIX="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props | head -n 1)"

          if [[ ! "${VERSION_PREFIX}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VersionPrefix must be a stable major.minor.patch version."
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v${VERSION_PREFIX}" ]]; then
              echo "Release tag must exactly match v${VERSION_PREFIX}."
              exit 1
            fi
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
              echo "Release tags must identify a commit already merged into main."
              exit 1
            }
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${VERSION_PREFIX}-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi

          echo "package_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build pinned legacy binaries
        run: dotnet build artifacts/legacy-source/src/Infrastructure/Infrastructure.csproj --configuration ${{ env.CONFIGURATION }} --output artifacts/legacy/v016 -m:1

      - name: Restore validation solution
        run: dotnet restore ObjectStorageAsset.sln

      - name: Build validation solution
        run: dotnet build ObjectStorageAsset.sln --configuration ${{ env.CONFIGURATION }} --no-restore -m:1 /p:ContinuousIntegrationBuild=true /p:Version=${{ steps.version.outputs.package_version }}

      - name: Unit, SQL integration and legacy compatibility tests
        env:
          OSA_V016_ASSEMBLY_DIRECTORY: ${{ github.workspace }}/artifacts/legacy/v016
        run: dotnet test test/UnitTests/UnitTests.csproj --configuration ${{ env.CONFIGURATION }} --no-build --no-restore --filter 'TestCategory!=Scale' --logger 'trx;LogFileName=regression.trx' --results-directory artifacts/test-results

      - name: In-memory provider E2E with real SQL
        run: dotnet run --project test/InMemoryE2E --configuration ${{ env.CONFIGURATION }} --no-build --no-restore

      - name: Checkout pinned MinIO source
        uses: actions/checkout@v4
        with:
          repository: minio/minio
          # RELEASE.2024-10-13T13-34-11Z; do not depend on retired binary/image endpoints.
          ref: d10bb7e1b667c2df72c394ef1fa52ab4a6802d0f
          path: artifacts/minio-source
          persist-credentials: false

      - name: Setup Go for the test provider
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
          cache-dependency-path: artifacts/minio-source/go.sum

      - name: Build pinned MinIO test provider
        working-directory: artifacts/minio-source
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o ../minio .

      - name: Start disposable MinIO
        env:
          MINIO_ROOT_USER: osa-ci
          MINIO_ROOT_PASSWORD: osa-ci-only-password
        shell: bash
        run: |
          nohup ./artifacts/minio server ./artifacts/minio-data --address 127.0.0.1:9000 > artifacts/minio.log 2>&1 &
          echo "$!" > artifacts/minio.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready; then exit 0; fi
            sleep 2
          done
          tail -n 80 artifacts/minio.log
          exit 1

      - name: Real MinIO E2E with real SQL
        run: dotnet run --project test/LiveE2E --configuration ${{ env.CONFIGURATION }} --no-build --no-restore

      - name: Pack
        run: dotnet pack ${{ env.PACK_SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-build --output ./artifacts/nuget -m:1 /p:ContinuousIntegrationBuild=true /p:Version=${{ steps.version.outputs.package_version }}

      - name: Validate package set and versions
        shell: pwsh
        run: .github/scripts/Test-Packages.ps1 -PackageDirectory artifacts/nuget -Version '${{ steps.version.outputs.package_version }}'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-${{ steps.version.outputs.package_version }}
          if-no-files-found: error
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg

      - name: Publish to NuGet.org
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          if [[ -z "${NUGET_API_KEY}" ]]; then
            echo "NUGET_API_KEY is not set."
            exit 1
          fi

          dotnet nuget push "artifacts/nuget/*.nupkg" --api-key "${NUGET_API_KEY}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate --no-symbols
          dotnet nuget push "artifacts/nuget/*.snupkg" --api-key "${NUGET_API_KEY}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate

      - name: Stop disposable MinIO
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/minio.pid ]]; then
            kill "$(cat artifacts/minio.pid)" 2>/dev/null || true
          fi
